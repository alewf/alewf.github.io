<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite White Room</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
}

canvas {
    display: block;
}

.overlay {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Helvetica, Arial, sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.4);
    pointer-events: none;
}
</style>
</head>
<body>

<div class="overlay">
    Infinite Room
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

/* -----------------------------
   Scene
----------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xffffff);

scene.fog = new THREE.FogExp2(
    0xffffff,
    0.01
);

/* -----------------------------
   Camera
----------------------------- */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0, 8);

/* -----------------------------
   Renderer
----------------------------- */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(window.devicePixelRatio);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

/* -----------------------------
   Lighting
----------------------------- */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        2.5
    );

scene.add(ambientLight);

const keyLight =
    new THREE.PointLight(
        0xffffff,
        3
    );

keyLight.position.set(
    0,
    2,
    6
);

scene.add(keyLight);

/* -----------------------------
   Hero Image
----------------------------- */

const loader =
    new THREE.TextureLoader();

const heroTexture =
    loader.load("images/LoveLetter.jpg");

const heroMaterial =
    new THREE.MeshBasicMaterial({
        map: heroTexture
    });

const hero =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            4,
            6
        ),
        heroMaterial
    );

hero.position.set(
    0,
    0,
    0
);

scene.add(hero);

/* -----------------------------
   Reflection
----------------------------- */

const reflectionMaterial =
    new THREE.MeshBasicMaterial({
        map: heroTexture,
        transparent: true,
        opacity: 0.12
    });

const reflection =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            4,
            6
        ),
        reflectionMaterial
    );

reflection.position.y = -6.1;
reflection.rotation.x = Math.PI;

scene.add(reflection);

/* -----------------------------
   Infinite Room Grid
----------------------------- */

const roomGroup =
    new THREE.Group();

scene.add(roomGroup);

const gridMaterial =
    new THREE.LineBasicMaterial({
        color: 0xd9d9d9,
        transparent: true,
        opacity: 0.5
    });

function createGridWall(
    size,
    divisions
){

    const points = [];

    for(
        let i = -size;
        i <= size;
        i += divisions
    ){

        points.push(
            new THREE.Vector3(
                -size,
                i,
                0
            ),
            new THREE.Vector3(
                size,
                i,
                0
            )
        );

        points.push(
            new THREE.Vector3(
                i,
                -size,
                0
            ),
            new THREE.Vector3(
                i,
                size,
                0
            )
        );
    }

    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(points);

    return new THREE.LineSegments(
        geometry,
        gridMaterial
    );
}

const SIZE = 100;
const DIV = 4;

/* Back Wall */

const backWall =
    createGridWall(
        SIZE,
        DIV
    );

backWall.position.z = -60;

roomGroup.add(backWall);

/* Floor */

const floor =
    createGridWall(
        SIZE,
        DIV
    );

floor.rotation.x =
    Math.PI / 2;

floor.position.y = -20;

roomGroup.add(floor);

/* Ceiling */

const ceiling =
    createGridWall(
        SIZE,
        DIV
    );

ceiling.rotation.x =
    Math.PI / 2;

ceiling.position.y = 20;

roomGroup.add(ceiling);

/* Left Wall */

const leftWall =
    createGridWall(
        SIZE,
        DIV
    );

leftWall.rotation.y =
    Math.PI / 2;

leftWall.position.x = -20;

roomGroup.add(leftWall);

/* Right Wall */

const rightWall =
    createGridWall(
        SIZE,
        DIV
    );

rightWall.rotation.y =
    Math.PI / 2;

rightWall.position.x = 20;

roomGroup.add(rightWall);

/* -----------------------------
   Render Loop
----------------------------- */

function animate(){

    requestAnimationFrame(
        animate
    );

    camera.lookAt(
        hero.position
    );

    renderer.render(
        scene,
        camera
    );
}

animate();

/* -----------------------------
   Responsive Resize
----------------------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
