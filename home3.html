<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite White Room</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
}

canvas {
    display: block;
}

.overlay {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Helvetica, Arial, sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.4);
    pointer-events: none;
}
</style>
</head>
<body>

<div class="overlay">
    Infinite Room
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

/* -----------------------------
   Scene
----------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xffffff);

scene.fog = new THREE.FogExp2(
    0xffffff,
    0.01
);

/* -----------------------------
   Camera
----------------------------- */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0, 8);

/* -----------------------------
   Renderer
----------------------------- */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(window.devicePixelRatio);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

/* -----------------------------
   Lighting
----------------------------- */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        2.5
    );

scene.add(ambientLight);

const keyLight =
    new THREE.PointLight(
        0xffffff,
        3
    );

keyLight.position.set(
    0,
    2,
    6
);

scene.add(keyLight);

/* -----------------------------
   Hero Image
----------------------------- */

const loader =
    new THREE.TextureLoader();

const heroTexture =
    loader.load("images/LoveLetter.jpg");

const heroMaterial =
    new THREE.MeshBasicMaterial({
        map: heroTexture
    });

const hero =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            4,
            6
        ),
        heroMaterial
    );

hero.position.set(
    0,
    0,
    0
);

scene.add(hero);

/* -----------------------------
   Reflection
----------------------------- */

const reflectionMaterial =
    new THREE.MeshBasicMaterial({
        map: heroTexture,
        transparent: true,
        opacity: 0.12
    });

const reflection =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            4,
            6
        ),
        reflectionMaterial
    );

reflection.position.y = -6.1;
reflection.rotation.x = Math.PI;

scene.add(reflection);

const dome = new THREE.Mesh(
    new THREE.SphereGeometry(
        80,
        64,
        64
    ),
    new THREE.MeshBasicMaterial({
        color: 0xe8e8e8,
        wireframe: true,
        side: THREE.BackSide,
        transparent: true,
        opacity: 0.2
    })
);

scene.add(dome);
/* -----------------------------
   Render Loop
----------------------------- */

function animate(){

    requestAnimationFrame(
        animate
    );

    camera.lookAt(
        hero.position
    );

    renderer.render(
        scene,
        camera
    );
}

animate();

/* -----------------------------
   Responsive Resize
----------------------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

    /* -----------------------------
   Linked Gallery Images
----------------------------- */

const galleryItems = [

{
    image: "images/LoveLetter.jpg",
    url: "about.html",
    x: -10,
    y: 4,
    z: -15
},

{
    image: "images/LoveLetter.jpg",
    url: "projects.html",
    x: 12,
    y: 2,
    z: -20
},

{
    image: "images/LoveLetter.jpg",
    url: "archive.html",
    x: -14,
    y: -3,
    z: -25
},

{
    image: "images/LoveLetter.jpg",
    url: "contact.html",
    x: 8,
    y: -5,
    z: -30
},

{
    image: "images/LoveLetter.jpg",
    url: "secret.html",
    x: 18,
    y: 5,
    z: -40
},

{
    image: "images/LoveLetter.jpg",
    url: "gallery.html",
    x: -20,
    y: 1,
    z: -50
}

];

const clickableFrames = [];

galleryItems.forEach(item => {

    const texture =
        loader.load(item.image);

    const material =
        new THREE.MeshBasicMaterial({
            map: texture
        });

    const frame =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                2.5,
                3.5
            ),
            material
        );

    frame.position.set(
        item.x,
        item.y,
        item.z
    );

    frame.userData.url =
        item.url;

    scene.add(frame);

    clickableFrames.push(frame);

});

    /* -----------------------------
   Clickable Images
----------------------------- */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

window.addEventListener(
    "click",
    (event)=>{

        mouse.x =
            (event.clientX /
            window.innerWidth)
            * 2 - 1;

        mouse.y =
            -(event.clientY /
            window.innerHeight)
            * 2 + 1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const intersects =
            raycaster.intersectObjects(
                clickableFrames
            );

        if(intersects.length){

            const hit =
                intersects[0].object;

            window.location.href =
                hit.userData.url;
        }

    }
);

    /*====HOVER===*/

    window.addEventListener(
    "mousemove",
    (event)=>{

        mouse.x =
            (event.clientX /
            window.innerWidth)
            * 2 - 1;

        mouse.y =
            -(event.clientY /
            window.innerHeight)
            * 2 + 1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const hits =
            raycaster.intersectObjects(
                clickableFrames
            );

        clickableFrames.forEach(frame=>{

            frame.scale.set(1,1,1);

        });

        if(hits.length){

            hits[0].object.scale.set(
                1.08,
                1.08,
                1.08
            );

            document.body.style.cursor =
                "pointer";

        } else {

            document.body.style.cursor =
                "default";
        }

    }
);

</script>
