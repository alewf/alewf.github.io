<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOUND FOOTAGE</title>

<!-- VHS.CSS -->
<link rel="stylesheet"
href="https://unpkg.com/vhs.css/dist/vhs.min.css">

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:monospace;
}

#bgCanvas{
    position:fixed;
    inset:0;
    z-index:0;
}

.hero{
    position:relative;
    width:100vw;
    height:100vh;
    z-index:2;
}

/* Main portrait */
.hero-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;

    filter:
        contrast(1.15)
        brightness(.92)
        saturate(.75);

    mix-blend-mode:screen;
}

/* Scanlines */
.scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;

    background:
    repeating-linear-gradient(
        to bottom,
        transparent 0px,
        rgba(255,255,255,.05) 1px,
        transparent 2px,
        transparent 4px
    );
}

/* VHS noise layer */
.noise{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:6;

    opacity:.15;

    background-image:
    radial-gradient(
        rgba(255,255,255,.4) 1px,
        transparent 1px
    );

    background-size:4px 4px;
}

/* RGB split effect */
.rgb{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:4;
}

.rgb::before,
.rgb::after{
    content:"";
    position:absolute;
    inset:0;
    background:inherit;
}

.rgb::before{
    transform:translateX(-2px);
    mix-blend-mode:screen;
    opacity:.15;
    background:red;
}

.rgb::after{
    transform:translateX(2px);
    mix-blend-mode:screen;
    opacity:.15;
    background:cyan;
}

/* Hidden links */
.secret{
    position:absolute;
    width:45px;
    height:45px;

    border-radius:50%;

    opacity:.03;
    background:white;

    transition:
        opacity .3s,
        transform .3s,
        box-shadow .3s;

    z-index:10;
}

.secret:hover{
    opacity:.85;
    transform:scale(1.5);

    box-shadow:
        0 0 15px red,
        0 0 30px cyan;
}

/* VHS timestamp */
.timestamp{
    position:absolute;
    bottom:20px;
    left:20px;

    color:white;
    z-index:20;

    font-size:14px;
    text-shadow:0 0 8px white;
}

/* REC indicator */
.rec{
    position:absolute;
    top:20px;
    left:20px;

    color:red;
    z-index:20;

    font-size:18px;
}

.rec::before{
    content:"● ";
}

</style>
</head>
<body>

<!-- Three.js background -->
<canvas id="bgCanvas"></canvas>

<div class="hero">

    <div class="rec">REC</div>

    <!-- VHS.CSS class -->
    <img
        src="person.jpg"
        class="hero-image vhs-flicker"
        alt="Portrait">

    <!-- Hidden hotspots -->

    <!-- Eye -->
    <a href="about.html"
       class="secret"
       style="top:28%;left:49%;"></a>

    <!-- Hand -->
    <a href="gallery.html"
       class="secret"
       style="top:45%;left:58%;"></a>

    <!-- Pocket -->
    <a href="projects.html"
       class="secret"
       style="top:55%;left:50%;"></a>

    <!-- Shoe -->
    <a href="archive.html"
       class="secret"
       style="top:86%;left:47%;"></a>

    <!-- Floating artifact -->
    <a href="secret.html"
       class="secret"
       style="top:18%;left:74%;"></a>

    <!-- Timestamp -->
    <a href="contact.html"
       class="secret"
       style="bottom:12px;left:12px;"></a>

    <div class="rgb"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>

    <div class="timestamp">
        10.31.1994 02:17:44
    </div>

</div>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>

/* THREE.JS BACKGROUND */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    canvas:document.getElementById("bgCanvas"),
    alpha:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

camera.position.z = 5;

/* subtle CRT-style particles */

const geometry =
    new THREE.BufferGeometry();

const count = 2500;

const positions = [];

for(let i=0;i<count;i++){

    positions.push(
        (Math.random()-0.5)*20,
        (Math.random()-0.5)*20,
        (Math.random()-0.5)*20
    );
}

geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        positions,
        3
    )
);

const material =
    new THREE.PointsMaterial({
        color:0xffffff,
        size:0.03
    });

const stars =
    new THREE.Points(
        geometry,
        material
    );

scene.add(stars);

function animate(){

    requestAnimationFrame(
        animate
    );

    stars.rotation.y += 0.0005;
    stars.rotation.x += 0.0002;

    renderer.render(
        scene,
        camera
    );
}

animate();

/* GSAP VHS GLITCHES */

function glitch(){

    gsap.to(".hero-image",{
        x:Math.random()*8-4,
        duration:0.05
    });

    gsap.to(".hero-image",{
        x:0,
        duration:0.08,
        delay:0.05
    });

    gsap.to(".timestamp",{
        opacity:0.2,
        duration:0.05,
        yoyo:true,
        repeat:1
    });
}

setInterval(
    glitch,
    2500 + Math.random()*3000
);

/* random flicker */

gsap.to(".hero",{
    opacity:0.96,
    repeat:-1,
    yoyo:true,
    duration:0.12,
    ease:"none"
});

window.addEventListener(
    "resize",
    ()=>{
        camera.aspect=
        window.innerWidth/
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
